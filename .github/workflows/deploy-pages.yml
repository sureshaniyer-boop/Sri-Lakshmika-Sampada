name: Deploy Sri Lakshmika Sampada boutique
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Prepare exact approved boutique website
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Sri_Lakshmika_Sampada_website.zip"
          test -f "$ZIP" || { echo "::error::Missing original boutique website ZIP: $ZIP"; exit 1; }
          mkdir -p /tmp/sampada-original _site
          unzip -q "$ZIP" -d /tmp/sampada-original
          ROOT="/tmp/sampada-original/sri_lakshmika_sampada_website"
          test -f "$ROOT/index.html" || { echo "::error::Original website index.html not found"; exit 1; }
          test -s "$ROOT/assets/sri-lakshmika-hero-model.webp" || { echo "::error::Hero model photo missing from archive"; exit 1; }
          test -s "$ROOT/assets/sri-lakshmika-hero-model.jpg" || { echo "::error::Hero model JPG missing from archive"; exit 1; }
          test -s "$ROOT/assets/sri-lakshmika-logo.png" || { echo "::error::Original boutique logo missing from archive"; exit 1; }
          grep -q 'sri-lakshmika-hero-model' "$ROOT/index.html" || { echo "::error::Home page not referencing model photograph"; exit 1; }
          cp -a "$ROOT"/. _site/
          # Preserve the approved original site, but overlay the latest hero CSS
          # edited in the repository. Otherwise changes to root styles.css are ignored.
          test -f styles.css || { echo "::error::Repository styles.css missing"; exit 1; }
          grep -q 'PREMIUM HERO MODEL DISPLAY' styles.css || { echo "::error::Updated hero CSS section missing"; exit 1; }
          printf '\n/* Hero portrait updates from repository styles.css */\n' >> _site/styles.css
          sed -n '/^\/\* ============================================/,$p' styles.css >> _site/styles.css
          # The original HTML uses .hero-model-photo; apply a separate desktop-only
          # override after the original and previous CSS. Keep mobile unchanged.
          test -s hero-desktop-fix.css || { echo "::error::Desktop hero fix missing"; exit 1; }
          cat hero-desktop-fix.css >> _site/styles.css
          grep -q '.hero-model-photo picture > img' _site/styles.css || { echo "::error::Correct portrait selector missing"; exit 1; }
          grep -q 'min-width: 801px' _site/styles.css || { echo "::error::Desktop breakpoint missing"; exit 1; }
          echo "Publishing original website and model assets with latest responsive portrait CSS"
          ls -lh _site/assets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4